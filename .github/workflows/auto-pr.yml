name: Auto Pull Request

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch de origem (ex: feature/ml-learning-lab)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr-to-develop:
    name: open-pr-to-develop
    runs-on: ubuntu-latest

    steps:
      - name: Definir branch de origem
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "head=${{ github.event.inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "head=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Criar ou confirmar PR para develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD: ${{ steps.meta.outputs.head }}
        run: |
          EXISTING=$(gh pr list --repo "${{ github.repository }}" --head "$HEAD" --base develop --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} já aberto: ${HEAD} → develop"
            gh pr view "$EXISTING" --repo "${{ github.repository }}" --web 2>/dev/null || true
            exit 0
          fi

          gh pr create \
            --repo "${{ github.repository }}" \
            --base develop \
            --head "$HEAD" \
            --title "${HEAD} → develop" \
            --body "$(cat <<EOF
          ## Pull request automático

          Branch \`${HEAD}\` integrada em \`develop\` via workflow **Auto Pull Request**.

          ### Checklist
          - [ ] CI verde (\`lint-test-build\` + \`validate-branch-flow\`)
          - [ ] Revisão de código
          - [ ] Test plan preenchido

          > Gerado automaticamente no push da branch \`${HEAD}\`.
          EOF
          )"
