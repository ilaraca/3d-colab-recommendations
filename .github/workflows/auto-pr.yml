name: Auto Pull Request

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch de origem (ex: feature/ml-learning-lab)'
        required: true
        type: string
        default: feature/ml-learning-lab

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr-to-develop:
    name: open-pr-to-develop
    runs-on: ubuntu-latest

    steps:
      - name: Definir branch de origem
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "head=${{ github.event.inputs.branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "head=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Criar ou confirmar PR para develop
        uses: actions/github-script@v7
        with:
          script: |
            const head = '${{ steps.meta.outputs.head }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              const { data: existing } = await github.rest.pulls.list({
                owner,
                repo,
                head: `${owner}:${head}`,
                base: 'develop',
                state: 'open',
              });

              if (existing.length > 0) {
                core.info(`PR #${existing[0].number} já aberto: ${head} → develop`);
                core.info(existing[0].html_url);
                return;
              }

              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title: `${head} → develop`,
                head,
                base: 'develop',
                body: [
                  '## Pull request automático',
                  '',
                  `Branch \`${head}\` → \`develop\` via workflow **Auto Pull Request**.`,
                  '',
                  '### Checklist',
                  '- [ ] CI verde (`lint-test-build` + `validate-branch-flow`)',
                  '- [ ] Revisão de código',
                  '',
                  `> Gerado automaticamente no push de \`${head}\`.`,
                ].join('\n'),
              });

              core.notice(`PR criado: #${pr.number} — ${pr.html_url}`);
            } catch (error) {
              const hint = [
                'Falha ao criar PR automaticamente.',
                'Habilite em Settings → Actions → General:',
                '  • Workflow permissions: Read and write',
                '  • Allow GitHub Actions to create and approve pull requests',
                'Ou abra manualmente: Compare & pull request no GitHub.',
                '',
                `Erro: ${error.message}`,
              ].join('\n');
              core.setFailed(hint);
            }
